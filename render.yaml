# Render Blueprint — a Web Service (not a Static Site) so the WebSocket relay
# stays in the same Node process as the PWA. Keep instance count at 1.
# Free instances sleep; open the URL a minute before meeting night.

services:
  - type: web
    name: fire-fellowship-captions
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Default translator is MyMemory (no key). Optional paid path in the
      # Render dashboard (never commit a real key; needs GCP billing):
      # TRANSLATE_PROVIDER=google
      # GOOGLE_TRANSLATE_API_KEY=...
